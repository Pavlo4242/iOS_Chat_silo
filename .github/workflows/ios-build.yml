name: iOS Build & IPA (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [master]



jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode & Install iOS 18.2
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app
          xcodebuild -downloadPlatform iOS
          xcodebuild -showsdks | grep iphoneos
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved') }}
      - name: Resolve packages


      - name: Build llama.xcframework (CRITICAL)
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          ./build-xcframework.sh
          cp -R build-apple/llama.xcframework ${{ github.workspace }}/
          ls -la ${{ github.workspace }}/llama.xcframework

      - name: Verify Xcode Project
        working-directory: apps/mobile/ios
        run: |
          echo "Checking project structure..."
          ls -la
          echo "Available schemes:"
          xcodebuild -list -project Silo.xcodeproj

      - name: Build Archive (with verbose errors)
        working-directory: apps/mobile/ios
        run: |
          # Create build directory
          mkdir -p build
          
          # Build archive with full error output
          xcodebuild archive \
            -project Silo.xcodeproj \
            -scheme Silo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Silo.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -verbose || exit 1
          
          # Verify archive was created
          if [ -d "build/Silo.xcarchive" ]; then
            echo "✅ Archive created successfully!"
            echo "Archive contents:"
            find build/Silo.xcarchive -type d -name "*.app" 2>/dev/null || echo "No .app found in archive"
            ls -la build/Silo.xcarchive/
          else
            echo "❌ Archive creation failed - no archive found"
            exit 1
          fi

      - name: Create IPA
        working-directory: apps/mobile/ios
        run: |
          ARCHIVE_PATH="$PWD/build/Silo.xcarchive"
          
          # Try multiple possible app locations
          APP_PATH=""
          
          # Check Products/Applications (standard location)
          if [ -d "$ARCHIVE_PATH/Products/Applications" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" -type d | head -1)
          fi
          
          # Check root of archive
          if [ -z "$APP_PATH" ] && [ -d "$ARCHIVE_PATH" ]; then
            APP_PATH=$(find "$ARCHIVE_PATH" -name "*.app" -type d -maxdepth 2 | grep -v ".dSYM" | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Could not find .app in archive"
            echo "Full archive contents:"
            find "$ARCHIVE_PATH" -type f -name "*.app" -o -name "*.plist" 2>/dev/null | head -20
            exit 1
          fi
          
          echo "✅ Found app at: $APP_PATH"
          
          # Create IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Silo-iPhone15.ipa Payload
          
          # Move to workspace root
          mv Silo-iPhone15.ipa ${{ github.workspace }}/
          rm -rf Payload
          
          echo "✅ IPA created at: ${{ github.workspace }}/Silo-iPhone15.ipa"
          ls -lh ${{ github.workspace }}/Silo-iPhone15.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silo-iPhone15-unsigned.ipa
          path: ${{ github.workspace }}/Silo-iPhone15.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload Archive (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Silo-xcarchive
          path: apps/mobile/ios/build/Silo.xcarchive
          retention-days: 7
          if-no-files-found: wa
