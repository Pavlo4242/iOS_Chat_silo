name: iOS Build & IPA (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Build llama.xcframework (CRITICAL)
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          ./build-xcframework.sh
          cp -R build-apple/llama.xcframework ${{ github.workspace }}/
          ls -la ${{ github.workspace }}/llama.xcframework

      - name: Build app
        run: |
          xcodebuild build \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          xcodebuild archive \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          APP_PATH=$(find $RUNNER_TEMP/Silo.xcarchive -name "*.app" -type d | head -1)
          mkdir -p $RUNNER_TEMP/build/Payload
          cp -R "$APP_PATH" $RUNNER_TEMP/build/Payload/
          cd $RUNNER_TEMP/build
          zip -r Silo-iPhone15.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Silo-iPhone15-Build
          path: ${{ runner.temp }}/build/*.ipa
