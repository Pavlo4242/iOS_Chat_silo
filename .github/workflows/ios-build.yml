name: iOS Build & IPA (Diagnostic)

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Debug - List Files
        run: |
          ls -la
          ls -la Silo/ || echo "Silo folder missing!"
          find . -name "*.swift" | head -10 || echo "No Swift files found"

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Resolve Packages
        run: xcodebuild -resolvePackageDependencies -project Silo.xcodeproj -scheme Silo

      - name: Archive (Verbose - NO || true)
        run: |
          echo "=== Starting Archive ==="
          xcodebuild clean archive \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee archive.log

      - name: Show Archive Result
        if: always()
        run: |
          echo "=== Archive Log ==="
          cat archive.log
          echo "=== Does xcarchive exist? ==="
          ls -la $RUNNER_TEMP/Silo.xcarchive 2>/dev/null || echo "No xcarchive found"

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: archive.log
