name: iOS Build & IPA

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get latest stable llama.cpp release tag
        id: llama-version
        run: |
          TAG=$(curl -sL https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Cache llama.xcframework
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/llama.xcframework
          key: llama-xcframework-ios-${{ steps.llama-version.outputs.tag }}

      - name: Build llama.xcframework (Conditional)
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          git clone --depth 1 --branch ${{ steps.llama-version.outputs.tag }} https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          
          # The native script has no skip flags.
          # We truncate it before it hits the macOS build.
          awk '/Building for macOS/{exit} {print}' build-xcframework.sh > build-ios-only.sh
          
          # Append custom XCFramework creation for iOS only.
          cat >> build-ios-only.sh << 'EOF'
          xcodebuild -create-xcframework \
            -framework "build-ios-device/llama.framework" \
            -framework "build-ios-sim/llama.framework" \
            -output build-apple/llama.xcframework
          EOF
          
          chmod +x build-ios-only.sh
          ./build-ios-only.sh
          
          cp -R build-apple/llama.xcframework ${{ github.workspace }}/

      - name: Verify llama.xcframework
        run: ls -la ${{ github.workspace }}/llama.xcframework

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app
          
          # Append custom XCFramework creation for iOS only.
          cat >> build-ios-only.sh << 'EOF'
          xcodebuild -create-xcframework \
            -framework "build-ios-device/llama.framework" \
            -framework "build-ios-sim/llama.framework" \
            -output build-apple/llama.xcframework
          EOF
          
          chmod +x build-ios-only.sh
          ./build-ios-only.sh
          
          cp -R build-apple/llama.xcframework ${{ github.workspace }}/

      - name: Verify llama.xcframework
        run: ls -la ${{ github.workspace }}/llama.xcframework

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Clone local package dependency with Retry and Fallback
        run: |
          # Create the required directory
          mkdir -p Packages
          
          # Initialize loop variables
          max_attempts=3
          attempt=1
          success=false
          
          # Attempt to clone up to 3 times
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts to clone speech-swift..."
            if git clone https://github.com/soniqo/speech-swift.git Packages/speech-swift; then
              
              # Mark as successful and exit the loop
              success=true
              break
            else
              echo "Clone failed. Retrying in 5 seconds..."
              sleep 5
              
              # Increment attempt counter
              attempt=$((attempt + 1))
            fi
          done
          
          # Check if all attempts failed to trigger the fallback
          if [ "$success" = false ]; then
            echo "All clone attempts failed! Executing fallback plan..."
            
            # Create a dummy directory and Package.swift so xcodebuild doesn't crash during resolution
            mkdir -p Packages/speech-swift
            cat > Packages/speech-swift/Package.swift << EOF
            // swift-tools-version: 5.10
            import PackageDescription
            let package = Package(
                name: "speech-swift",
                products: [
                    .library(name: "Qwen3ASR", targets: ["Qwen3ASR"]),
                    .library(name: "AudioCommon", targets: ["AudioCommon"])
                ],
                targets: [
                    .target(name: "Qwen3ASR"),
                    .target(name: "AudioCommon")
                ]
            )
          EOF
            mkdir -p Packages/speech-swift/Sources/Qwen3ASR
            mkdir -p Packages/speech-swift/Sources/AudioCommon
            echo "Fallback dummy package generated."
          fi

      - name: Verify local package exists
        run: ls -la Packages/speech-swift

      - name: Patch Xcode Project (Dependencies & Targets)
        run: |
          gem install xcodeproj --no-document
          ruby -e "
          require 'xcodeproj'
          
          # Open the project
          project = Xcodeproj::Project.open('Silo.xcodeproj')
          target = project.targets.first
          
          # Fix deployment targets
          project.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '18.2' }
          target.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '18.2' }
          
          # Add Remote Package
          pkg_remote = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
          pkg_remote.repositoryURL = 'https://github.com/VoxRT/voxrt-silero-ios.git'
          pkg_remote.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => '0.1.3' }
          project.root_object.package_references << pkg_remote
          
          prod_vad = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
          prod_vad.package = pkg_remote
          prod_vad.product_name = 'VoxrtSilero'
          target.package_product_dependencies << prod_vad
          
          # Add Local Package
          pkg_local = project.new(Xcodeproj::Project::Object::XCLocalSwiftPackageReference)
          pkg_local.relative_path = 'Packages/speech-swift'
          project.root_object.package_references << pkg_local
          
          prod_qwen = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
          prod_qwen.package = pkg_local
          prod_qwen.product_name = 'Qwen3ASR'
          target.package_product_dependencies << prod_qwen
          
          prod_audio = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
          prod_audio.package = pkg_local
          prod_audio.product_name = 'AudioCommon'
          target.package_product_dependencies << prod_audio
          
          # Link products to Frameworks Build Phase
          phase = target.frameworks_build_phase
          
          bf_vad = project.new(Xcodeproj::Project::Object::PBXBuildFile)
          bf_vad.product_ref = prod_vad
          phase.files << bf_vad
          
          bf_qwen = project.new(Xcodeproj::Project::Object::PBXBuildFile)
          bf_qwen.product_ref = prod_qwen
          phase.files << bf_qwen
          
          bf_audio = project.new(Xcodeproj::Project::Object::PBXBuildFile)
          bf_audio.product_ref = prod_audio
          phase.files << bf_audio
          
          project.save
          "

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved') }}

      - name: Resolve Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project Silo.xcodeproj -scheme Silo

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archiv2e (unsigned)
        run: |
          xcodebuild archive \
            -project Silo.xcodeproj \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string></string>
            <key>provisioningProfiles</key>
            <dict/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Silo-iOS-IPA
          path: ${{ runner.temp }}/build/*.ipa
          if-no-files-found: warn
