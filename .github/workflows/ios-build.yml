name: iOS Build & IPA

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build-ios:
    runs-on: macos-15 # Uses Apple Silicon runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

          
      - name: Patch speech-swift AudioIO.swift (Fix Bluetooth)
        run: |
          sed -i '' 's/\.allowBluetoothHFP/\.allowBluetooth/g' Dependencies/speech-swift/Sources/AudioCommon/AudioIO.swift


      - name: Get llama.cpp Latest Commit
        id: llama-commit
        run: |
          SHA=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/commits/master | jq -r '.sha')
          if [ "$SHA" = "null" ] || [ -z "$SHA" ]; then
            SHA="fallback-$(date +%Y%m%d)"
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Restore llama.xcframework Cache
        id: restore-llama-cache
        uses: actions/cache/restore@v4
        with:
          path: llama.xcframework
          key: llama-xcframework-${{ runner.os }}-${{ steps.llama-commit.outputs.sha }}

      - name: Set up Xcode 16.2 (iOS 18 SDK)
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      # Only clone and build llama.cpp if cache was NOT hit
      - name: "Clone & Build llama.cpp"
        if: steps.restore-llama-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cd /tmp/llama.cpp
          chmod +x ./build-xcframework.sh
          ./build-xcframework.sh
          cp -R build-apple/llama.xcframework "$GITHUB_WORKSPACE/"

      # Save the compiled llama.xcframework immediately upon successful build
      - name: Save llama.xcframework Cache
        if: steps.restore-llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: llama.xcframework
          key: llama-xcframework-${{ runner.os }}-${{ steps.llama-commit.outputs.sha }}

      # Step Moved Up: Patch Xcode Project BEFORE resolving dependencies or building
      - name: Patch Xcode Project (Dependencies & Targets)
        run: |
          gem install xcodeproj --no-document
          ruby -e "
          require 'xcodeproj'
          
          # Open the project
          project = Xcodeproj::Project.open('Silo.xcodeproj')
          target = project.targets.first
          
          # Fix deployment targets to 18.2
          project.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '18.0' }
          target.build_configurations.each { |c| c.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '18.0' }
          
          # Add Remote Package
          pkg_remote = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
          pkg_remote.repositoryURL = 'https://github.com/VoxRT/voxrt-silero-ios.git'
          pkg_remote.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => '0.1.3' }
          project.root_object.package_references << pkg_remote
          
          prod_vad = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
          prod_vad.package = pkg_remote
          prod_vad.product_name = 'VoxrtSilero'
          target.package_product_dependencies << prod_vad
          
          # Add Local Package
          pkg_local = project.new(Xcodeproj::Project::Object::XCLocalSwiftPackageReference)
          pkg_local.relative_path = 'Dependencies/speech-swift'
          project.root_object.package_references << pkg_local
          
          prod_qwen = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
          prod_qwen.package = pkg_local
          prod_qwen.product_name = 'Qwen3ASR'
          target.package_product_dependencies << prod_qwen
          
          prod_audio = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
          prod_audio.package = pkg_local
          prod_audio.product_name = 'AudioCommon'
          target.package_product_dependencies << prod_audio
          
          puts '--> Linking products to Frameworks Build Phase...'
          phase = target.frameworks_build_phase
        
          bf_vad = project.new(Xcodeproj::Project::Object::PBXBuildFile)
          bf_vad.product_ref = prod_vad
          phase.files << bf_vad
        
          bf_qwen = project.new(Xcodeproj::Project::Object::PBXBuildFile)
          bf_qwen.product_ref = prod_qwen
          phase.files << bf_qwen
        
          bf_audio = project.new(Xcodeproj::Project::Object::PBXBuildFile)
          bf_audio.product_ref = prod_audio
          phase.files << bf_audio
        
          puts '--> Saving Silo.xcodeproj...'
          project.save
          puts '--> Xcode project patched successfully!'
          "

      # Resolve package dependencies
      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -project Silo.xcodeproj

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache iOS Platform
        id: ios-cache
        uses: actions/cache@v4
        with:
          # This is the default path where Xcode stores downloaded simulator runtimes
          path: /Library/Developer/CoreSimulator/Profiles/Runtimes
          key: ios-platform-xcode-16.2

      - name: Download iOS Platform
        # Only run the massive download if the cache wasn't found
        if: steps.ios-cache.outputs.cache-hit != 'true'
        run: xcodebuild -downloadPlatform iOS

      - name: Build Xcode Project (Unsigned)
        run: |
                set -o pipefail
                xcodebuild build \
                  -project Silo.xcodeproj \
                  -scheme Silo \
                  -configuration Release \
                  -sdk iphoneos \
                  -destination "generic/platform=iOS" \
                  -derivedDataPath ./build \
                  CODE_SIGN_STYLE="Manual" \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGNING_ALLOWED=NO \
                  DEVELOPMENT_TEAM="" \
                  PROVISIONING_PROFILE_SPECIFIER="" | xcbeautify



            
      # Package the built app into a payload directory and zip into an IPA
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Silo.app Payload/
          zip -qr Silo.ipa Payload/

      # Upload the output artifact to the GitHub run
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silo-Release-IPA
          path: Silo.ipa
