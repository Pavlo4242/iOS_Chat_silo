name: iOS Build & IPA (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app


      - name: Apply Xcode Signing Fixes & Clean Up Custom Files
        working-directory: apps/mobile/ios
        run: |
          set -e
          echo "Installing xcodeproj gem..."
          gem install xcodeproj
        

      - name: Build llama.xcframework (CRITICAL)
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          ./build-xcframework.sh
          cp -R build-apple/llama.xcframework ${{ github.workspace }}/
          ls -la ${{ github.workspace }}/llama.xcframework

     
    # MODIFICATION: Added export options for unsigned build to ensure consistency
      - name: Setup Export Options
        working-directory: apps/mobile/ios

  
      - name: Build Archive
        working-directory: apps/mobile/ios
        run: |
                xcodebuild clean -project Silo.xcodeproj \
                  -scheme Silo \
                  -quiet \
                  -configuration Release \
                  -sdk iphoneos \
                  -destination 'generic/platform=iOS' \
                  -archivePath $PWD/build/Silo.xcarchive \
                  archive \
                  CODE_SIGN_IDENTITY="" \
                  DEVELOPMENT_TEAM="" \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGNING_ALLOWED=NO
       
      
      - name: Create IPA
        run: |
                APP_PATH=$(find $RUNNER_TEMP/Silo.xcarchive -name "*.app" -type d | head -1)
                mkdir -p $RUNNER_TEMP/build/Payload
                cp -R "$APP_PATH" $RUNNER_TEMP/build/Payload/
                cd $RUNNER_TEMP/build
                zip -r Silo-iPhone15.ipa Payload
    
     
