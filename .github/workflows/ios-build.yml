name: iOS Build & IPA (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode + Debug
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app
          xcodebuild -version
          xcodebuild -showsdks
          ls -la Silo/ || echo "Silo folder missing"

      - name: Resolve Packages
        run: xcodebuild -resolvePackageDependencies -project Silo.xcodeproj -scheme Silo

      - name: Archive (Fixed SDK + Deployment Target)
        run: |
          xcodebuild clean archive \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=18.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty || true

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build \
            | xcpretty || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Silo-iOS-IPA
          path: ${{ runner.temp }}/build/*.ipa
          retention-days: 7

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: archive.log
          retention-days: 3          xcodebuild clean archive \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee archive.log

      - name: Show Archive Result
        if: always()
        run: |
          echo "=== Archive Log ==="
          cat archive.log
          echo "=== Does xcarchive exist? ==="
          ls -la $RUNNER_TEMP/Silo.xcarchive 2>/dev/null || echo "No xcarchive found"

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: archive.log
