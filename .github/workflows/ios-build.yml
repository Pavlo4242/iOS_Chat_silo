name: iOS Build & IPA (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.2.app

      - name: Build llama.xcframework (CRITICAL)
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          ./build-xcframework.sh
          cp -R build-apple/llama.xcframework ${{ github.workspace }}/
          ls -la ${{ github.workspace }}/llama.xcframework

      - name: Install Dependencies
        working-directory: apps/mobile/ios
        run: |
          # Install any required gems
          gem install xcodeproj if command -v gem > /dev/null
          
          # Create Signing.local.xcconfig if it doesn't exist (empty for CI)
          if [ ! -f Config/Signing.local.xcconfig ]; then
            echo "// Auto-generated for CI" > Config/Signing.local.xcconfig
            echo "// No team ID set - unsigned build only" >> Config/Signing.local.xcconfig
          fi

      - name: Build Unsigned Archive
        working-directory: apps/mobile/ios
        run: |
          # Build without signing (following project's empty DEVELOPMENT_TEAM approach)
          xcodebuild clean archive \
            -project Silo.xcodeproj \
            -scheme Silo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/Silo.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Create Unsigned IPA
        run: |
          ARCHIVE_PATH="apps/mobile/ios/build/Silo.xcarchive"
          
          # Verify archive exists
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "Error: Archive not found at $ARCHIVE_PATH"
            exit 1
          fi
          
          # Find the .app bundle
          APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app in archive"
            echo "Contents of archive:"
            find "$ARCHIVE_PATH" -type d -name "*.app" 2>/dev/null || echo "No .app found"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          
          # Create Payload directory and package IPA
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Silo-iPhone15.ipa Payload
          
          # Move to workspace root
          mv Silo-iPhone15.ipa ${{ github.workspace }}/
          rm -rf Payload
          
          echo "IPA created at: ${{ github.workspace }}/Silo-iPhone15.ipa"
          
          # Show IPA info
          ls -lh ${{ github.workspace }}/Silo-iPhone15.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silo-iPhone15-unsigned.ipa
          path: ${{ github.workspace }}/Silo-iPhone15.ipa
          retention-days: 30
          compression-level: 0

      - name: Upload Archive (Optional - for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Silo-xcarchive
          path: apps/mobile/ios/build/Silo.xcarchive
          retention-days: 7
