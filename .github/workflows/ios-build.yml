name: iOS Build & IPA

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode & Install iOS 18.2 Platform
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app
          xcodebuild -downloadPlatform iOS

      - name: Fix Deployment Target (18.6 → 18.2)
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 18.6/IPHONEOS_DEPLOYMENT_TARGET = 18.2/g' Silo.xcodeproj/project.pbxproj

      - name: Verify local package exists
        run: ls -la Dependencies/speech-swift

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved') }}

      - name: Resolve Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project Silo.xcodeproj -scheme Silo

      - name: Archive (unsigned)
        run: |
          xcodebuild clean archive \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Check module name in speech-swift
        run: |
          cat Dependencies/speech-swift/Package.swift | grep -A2 "target"


      - name: Export IPA
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>development</string><key>signingStyle</key><string>manual</string></dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Silo-iOS-IPA
          path: ${{ runner.temp }}/build/*.ipa
          if-no-files-found: warn
