name: iOS Build & IPA

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build iOS
    runs-on: macos-15
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode & Debug SDKs
        run: |
          sudo xcode-select -switch /Applications/Xcode_16.2.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}

      - name: Resolve Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project Silo.xcodeproj -scheme Silo

      # === Signing Setup ===
      - name: Install Certificate and Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # === Simulator Check (Simplified) ===
      - name: Build for iOS Simulator (Quick Check)
        run: |
          xcodebuild build \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      # === Main Device Archive ===
      - name: Archive for iOS Device
        run: |
          xcodebuild clean archive \
            -project Silo.xcodeproj \
            -scheme Silo \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            | xcpretty || true

      # === Export IPA ===
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Silo.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build \
            | xcpretty || true

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Silo-iOS-IPA
          path: ${{ runner.temp }}/build/*.ipa
          retention-days: 7

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Logs/DiagnosticReports
            $RUNNER_TEMP/*.log
          retention-days: 7
